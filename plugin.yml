name: LuaLoader
main: LuaLoader\Main
version: 1.1.0
api: [2.0.0]
load: STARTUP
author: Ajwwk and Gemini
description: Adds support for Lua plugins with cross-platform library support.

commands:
  luareload:
    description: Reload Lua plugin scripts
    usage: /luareload <plugin_name|all>
    permission: lualoader.reload

permissions:
  lualoader.reload:
    description: Allows reloading Lua plugins
    default: op
